name: testflight

# GitHub の Mac ランナーで署名付きビルドを作り TestFlight へ送る（Mac 不要。kajisho5/OSEE_Control_Software と同じ方式）。
# 署名：xcodebuild の自動署名 ＋ App Store Connect API キー（証明書・プロファイルは Apple 側で自動発行・管理）
# 送信：App Store Connect API の Build Uploads（.github/scripts/asc_upload.py）
# 必要な Secrets（docs/TESTFLIGHT.md）：APPSTORE_ISSUER_ID, APPSTORE_KEY_ID, APPSTORE_P8, APPLE_TEAM_ID
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  BUNDLE_ID: com.seventhwell.crospoint

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing APPSTORE_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing APPSTORE_ISSUER_ID"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$P8" ] || missing="$missing APPSTORE_P8"
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets not set:$missing (see docs/TESTFLIGHT.md)"
            exit 1
          fi
      - name: Write App Store Connect API key
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Check App Store Connect API access
        # 長いビルドの前に、鍵が App Store Connect に通るか・アプリ記録があるかを確かめる（秘密の値は出力しない）
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, os, re, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt

          kid, iss, team, bundle = os.environ["ASC_KEY_ID"], os.environ["ASC_ISSUER_ID"], os.environ["TEAM_ID"], os.environ["BUNDLE_ID"]
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{kid}.p8")).read()

          def shape(name, value, pattern):
              ok = re.fullmatch(pattern, value) is not None
              print(f"{name}: length {len(value)}, format {'ok' if ok else 'UNEXPECTED'}"
                    + (", has surrounding whitespace" if value != value.strip() else ""))
              return ok

          shapes = [
              shape("APPSTORE_KEY_ID", kid, r"[A-Z0-9]{10}"),
              shape("APPSTORE_ISSUER_ID", iss, r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"),
              shape("APPLE_TEAM_ID", team, r"[A-Z0-9]{10}"),
          ]
          pem = "-----BEGIN PRIVATE KEY-----" in key and "-----END PRIVATE KEY-----" in key
          print(f"APPSTORE_P8: PEM markers {'ok' if pem else 'MISSING'}")
          if not all(shapes) or not pem:
              print("::error::A secret has an unexpected format (see the lines above and docs/TESTFLIGHT.md)")
              sys.exit(1)

          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          query = urllib.parse.urlencode({"filter[bundleId]": bundle, "fields[apps]": "bundleId,name"})
          req = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/apps?{query}",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  status, body = res.status, json.load(res)
          except urllib.error.HTTPError as e:
              status, raw = e.code, e.read().decode(errors="replace")
              try:
                  body = json.loads(raw)
              except ValueError:
                  body = raw
          print(f"GET /v1/apps -> HTTP {status}")
          print(json.dumps(body, ensure_ascii=False, indent=2)[:4000])
          if status != 200:
              print(f"::error::App Store Connect API rejected the key (HTTP {status}); see the response above")
              sys.exit(1)
          if not body.get("data"):
              print(f"::error::No App Store Connect app with bundle ID {bundle} (docs/TESTFLIGHT.md step 3)")
              sys.exit(1)
          print("App Store Connect API access ok:", body["data"][0]["attributes"].get("name"))

          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/users?limit=1",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  status = res.status
          except urllib.error.HTTPError as e:
              status = e.code
          print(f"GET /v1/users -> HTTP {status}"
                + ("" if status == 200 else " (the key is probably not Admin; docs/TESTFLIGHT.md step 4)"))
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select Xcode 26
        # App Store Connect は iOS 26 SDK 以降で作ったビルドしか受け付けない（エラー 90725）
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          [ -n "$xcode" ] || { echo "::error::No Xcode 26 on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - run: npm ci
      - name: pod install
        working-directory: ios
        run: pod install
      - name: Import signing identity (ci/signing, created by signing.yml)
        # 毎回新しい証明書を作らせない：暗号化済みの秘密鍵と証明書を一時キーチェーンに入れておくと、自動署名はそれを使う
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ ! -f ci/signing/ios.key.enc ]; then
            echo "::warning::ci/signing が無いので自動署名に任せます（証明書の上限に当たったら signing.yml を実行してください。docs/TESTFLIGHT.md）"
            exit 0
          fi
          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::SIGNING_KEY_PASSWORD secret is not set (needed to decrypt ci/signing/ios.key.enc)"
            exit 1
          fi
          set -euo pipefail
          dir="$RUNNER_TEMP/sign"; mkdir -p "$dir"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ci/signing/ios.key.enc -out "$dir/ios.key" -pass env:SIGNING_KEY_PASSWORD
          kc="$RUNNER_TEMP/build.keychain-db"; kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          for f in development distribution; do
            openssl x509 -inform DER -in "ci/signing/$f.cer" -out "$dir/$f.pem"
            openssl pkcs12 -export -inkey "$dir/ios.key" -in "$dir/$f.pem" -name "$f" -out "$dir/$f.p12" -passout "pass:$kcpass"
            security import "$dir/$f.p12" -k "$kc" -P "$kcpass" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          done
          # Apple WWDR 中間証明書（信頼チェーン）。無いと identity が "valid" にならない
          curl -fsSL -o "$dir/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$dir/AppleWWDRCAG3.cer" -k "$kc" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          rm -f "$dir/ios.key"
          echo "識別子（valid identities）:"
          security find-identity -v -p codesigning "$kc" | sed 's/[0-9A-F]\{40\}/<sha1>/'
      - name: Set build number (CFBundleVersion = run number)
        # Expo prebuild は CFBundleVersion を文字列 "1" で書くため、CURRENT_PROJECT_VERSION では上書きされない。Info.plist を直接書き換える
        run: |
          plist=ios/SWCROSSPOINT/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist") CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
      - name: Archive (automatic signing with the API key)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace SWCROSSPOINT.xcworkspace \
            -scheme SWCROSSPOINT \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*Crosspoint|ARCHIVE (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Export the App Store build (.ipa)
        # xcodebuild 自身のアップロード（destination=upload）は旧サービス経由で鍵を拒否した実績があるため、.ipa を書き出して次で API 送信する
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log
      - name: Upload to App Store Connect (TestFlight)
        run: |
          set -o pipefail
          ipa=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          [ -n "$ipa" ] || { echo "::error::No .ipa in $RUNNER_TEMP/export"; exit 1; }
          info="$RUNNER_TEMP/App.xcarchive/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$info")
          build=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$info")
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/asc_upload.py "$ipa" "$BUNDLE_ID" "$version" "$build" 2>&1 | tee upload.log
      - name: Show distribution log
        if: failure()
        run: |
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' -type d 2>/dev/null | while read -r dir; do
            for f in "$dir"/*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f")"
              sed -E -e 's/eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/<redacted-jwt>/g' \
                -e 's/(Bearer)[[:space:]]+[^[:space:]"]+/\1 <redacted>/g' "$f" | tail -n 300
              echo "::endgroup::"
            done
          done
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            upload.log
          if-no-files-found: ignore
