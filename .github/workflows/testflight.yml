name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  testflight:
    name: archive → TestFlight (fastlane match / gym / pilot)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Secrets check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID MATCH_GIT_URL MATCH_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets が未設定:$missing（docs/TESTFLIGHT.md）"; exit 1
          fi
          echo "secrets OK"
      - run: npm ci
      - name: pod install
        working-directory: ios
        run: pod install
      - name: fastlane version
        run: fastlane --version | tail -1
      - name: fastlane ios testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_BUNDLE_ID: com.seventhwell.crosspoint
          TESTFLIGHT_CHANGELOG: ${{ github.event.head_commit.message }}
          FASTLANE_SKIP_UPDATE_CHECK: 1
          FASTLANE_HIDE_CHANGELOG: 1
        run: fastlane ios testflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: |
            build/*.ipa
            ~/Library/Logs/gym/*.log
            fastlane/report.xml
          retention-days: 7
          if-no-files-found: ignore
