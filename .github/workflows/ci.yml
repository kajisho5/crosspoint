name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CI: 1
  EXPO_NO_TELEMETRY: 1

jobs:
  test:
    name: test / typecheck / doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npx expo-doctor

  ios-build:
    name: iOS build (simulator, Swift module compile)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tool versions
        run: |
          xcodebuild -version
          node --version
          pod --version
      - run: npm ci
      - name: expo prebuild (ios)
        run: npx expo prebuild --platform ios --clean --no-install
      - name: pod install
        working-directory: ios
        run: pod install
      - name: Resolve workspace / scheme
        id: ws
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS scheme=$SCHEME"
      - name: xcodebuild (Debug, iphonesimulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "${{ steps.ws.outputs.workspace }}" \
            -scheme "${{ steps.ws.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*CrosspointMidi|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log
      - name: Collect simulator app
        if: success()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)
          echo "app=$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" sw-crosspoint-simulator.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sw-crosspoint-ios-simulator
          path: sw-crosspoint-simulator.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
